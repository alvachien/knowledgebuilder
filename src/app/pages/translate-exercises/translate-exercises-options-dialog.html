<div *transloco="let t">
  <h2 mat-dialog-title>{{ t('translateExercises.options') }}</h2>
  <mat-dialog-content>
    <mat-form-field class="control-full-width">
      <mat-label>{{ t('direction') }}</mat-label>
      <mat-select matNativeControl [(value)]="direction">
        @for (lvl of allDirections; track lvl.value ) {
          <mat-option [value]="lvl.value">{{getDirectionName(lvl.value)}}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field class="control-full-width">
      <mat-label>{{ t('count') }}</mat-label>
      <input matInput type="number" [(ngModel)]="countOfItems" [disabled]="data.withSelection" />
      <span matSuffix>{{data.reciteQueuesCount}}</span>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">{{ t('no') }}</button>
    <button mat-button (click)="onYesClick()" cdkFocusInitial>{{ t('ok') }}</button>
  </mat-dialog-actions>
</div>
