<div *transloco="let t">
  <h2 mat-dialog-title>{{ t('chineseExercises.optionsOfReciting') }}</h2>
  <mat-dialog-content class="control-full-width">
    <mat-form-field class="control-full-width">
      <mat-label>{{ t('chineseExercises.level') }}</mat-label>
      <mat-select [(ngModel)]="selectedLevel" name="reciteLevel">
        @for (lvl of allLevels; track $index) {
          <mat-option [value]="lvl">{{getQuestionBankLevelName(lvl)}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field class="control-full-width">
      <mat-label>{{ t('count') }}</mat-label>
      <input matInput type="number" [(ngModel)]="countOfItems" name="reciteCount" [disabled]="data.disableCount">
      <span matSuffix>{{data.reciteContentCount}}</span>
    </mat-form-field>

    <div class="control-full-width">
      <mat-checkbox [(ngModel)]="allowEmptyAnswer" name="reciteAllowEmpty"> {{ t('chineseExercises.allowEmptyAnswer') }} </mat-checkbox>
    </div>

  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">{{ t('no') }}</button>
    <button mat-button (click)="onYesClick()" cdkFocusInitial>{{ t('ok') }}</button>
  </mat-dialog-actions>
</div>
