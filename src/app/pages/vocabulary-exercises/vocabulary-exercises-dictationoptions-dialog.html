<div *transloco="let t">
  <h2 mat-dialog-title>{{ t('vocabularyExercises.optionsOfDictation') }}</h2>
  <mat-dialog-content class="control-full-width">
    <mat-form-field class="control-full-width">
      <mat-label>{{ t('count') }}</mat-label>
      <input matInput type="number" [(ngModel)]="countOfItems" [disabled]="data.withSelection">
      <span matSuffix>{{data.wordQueueCount}}</span>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">{{ t('no') }}</button>
    <button mat-button (click)="onYesClick()" [disabled]="isCountInvalid" cdkFocusInitial>{{ t('ok') }}</button>
  </mat-dialog-actions>
</div>
