<main focusOnNavigation aria-label="Vocabulary Exercises page" class="vocabulary-page">
  <div class="vocabulary-page-content">
    @switch (mode()) {
       @case ('review') {
        <app-vocabulary-exercises-review-session
          [hideExplain]="reviewSetting.hideExplain"
          (quit)="onQuitReview()">
        </app-vocabulary-exercises-review-session>
      }
       @case ('spelling') {
        <app-vocabulary-exercises-spelling-session
          [hideExplain]="spellingSetting.hideExplain"
          (quit)="onQuitSpelling()">
        </app-vocabulary-exercises-spelling-session>
      }
       @case ('spellingresult') {
        <app-vocabulary-exercises-spelling-result
          (backToList)="onQuitSpelling()">
        </app-vocabulary-exercises-spelling-result>
      }
       @case ('dictation') {
        <app-vocabulary-exercises-dictation-session
          (quit)="onQuitDictation()">
        </app-vocabulary-exercises-dictation-session>
      }
       @case ('dictationresult') {
        <app-vocabulary-exercises-dictation-result
          (backToList)="onQuitDictation()">
        </app-vocabulary-exercises-dictation-result>
      }
       @case ('quiz') {
        <app-vocabulary-exercises-quiz-session
          (quit)="onQuitQuiz()">
        </app-vocabulary-exercises-quiz-session>
      }
       @case ('quizresult') {
        <app-vocabulary-exercises-quiz-result
          (backToList)="onQuitQuiz()">
        </app-vocabulary-exercises-quiz-result>
      }
      @default {
        <app-vocabulary-exercises-word-list
          [allFiles]="allFiles()"
          [(selectedFile)]="selectedFile"
          [isLoadingContents]="isLoadingContents()"
          [dataSource]="dataSource"
          [selection]="selection"
          [contentRatings]="contentRatingMap()"
          [ratingsEnabled]="studyContentId > 0"
          [wordConditions]="wordConditions()"
          [ratingConditions]="ratingConditions()"
          [appliedFreeText]="freeText()"
          (downloadTemplate)="onDownloadTemplateButtonClick()"
          (addFileClick)="onAddFileButtonClick($event)"
          (tempFileSelected)="onAddTempFile($event)"
          (fileSelectionChanged)="onFileSelectionChanged($event)"
          (freeTextChanged)="onFreeTextChanged($event)"
          (defineWordFilter)="onDefineWordFilter()"
          (clearWordFilter)="onClearWordFilter()"
          (defineRatingFilter)="onDefineRatingFilter()"
          (clearRatingFilter)="onClearRatingFilter()"
          (quickSelect)="onQuickSelect($event)"
          (clearSelection)="onClearSelection()"
          (allRowsToggled)="toggleAllRows()"
          (contentRatingChanged)="onContentRatingChanged($event.item, $event.event)"
          (review)="onReviewWithOptions()"
          (worksheet)="onWorksheetWithOptions()"
          (spelling)="onSpellingWithOptions()"
          (dictation)="onDictationWithOptions()"
          (quiz)="onQuizWithOptions()">
        </app-vocabulary-exercises-word-list>
      }
    }
  </div>
</main>

<app-footer></app-footer>
