<div *transloco="let t">
  <h2 mat-dialog-title>{{ t('vocabularyExercises.optionsOfTyping') }}</h2>
  <mat-dialog-content class="control-full-width">
    <mat-form-field class="control-full-width">
      <mat-label>{{ t('vocabularyExercises.count') }}</mat-label>
      <input matInput type="number" [(ngModel)]="countOfItems" [disabled]="data.withSelection">
      <span matSuffix>{{data.wordQueueCount}}</span>
    </mat-form-field>
    <div class="control-full-width">
      <mat-checkbox [(ngModel)]="disableVoice"> {{ t('vocabularyExercises.disableVoice') }}</mat-checkbox>
    </div>
    <div class="control-full-width">
      <mat-checkbox [(ngModel)]="hideExplain"> {{ t('vocabularyExercises.hideExplaination') }} </mat-checkbox>
    </div>
  </mat-dialog-content>
  @if (isOutputDisabled) {
    <div class="control-full-width dialog-validation-message">{{ t('vocabularyExercises.voiceAndExplainExclusive') }}</div>
  }
  <mat-dialog-actions>
    <button mat-button (click)="onNoClick()">{{ t('no') }}</button>
    <button mat-button (click)="onYesClick()" [disabled]="isOutputDisabled || isCountInvalid" cdkFocusInitial>{{ t('ok') }}</button>
  </mat-dialog-actions>
</div>
