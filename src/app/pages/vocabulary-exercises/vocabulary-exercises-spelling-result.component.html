<ng-container *transloco="let t">
  <div class="container">
    <div class="result-header">{{ t('vocabularyExercises.score') }}: {{store.correctCount()}} / {{store.queue().length }} </div>
    <button mat-raised-button color="primary" (click)="backToList.emit()">{{ t('backToList') }}</button>

    <table mat-table [dataSource]="store.results()" class="mat-elevation-z8 w-full">
      <!-- English Word Column -->
      <ng-container matColumnDef="word">
        <th mat-header-cell *matHeaderCellDef> {{ t('vocabularyExercises.word') }} </th>
        <td mat-cell *matCellDef="let element"> {{element.enword}} </td>
      </ng-container>

      <!-- Correct Column -->
      <ng-container matColumnDef="correct">
        <th mat-header-cell *matHeaderCellDef> {{ t('vocabularyExercises.correct') }} </th>
        <td mat-cell *matCellDef="let element">
          <mat-checkbox [checked]="element.correct" [disabled]="true"></mat-checkbox>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</ng-container>
