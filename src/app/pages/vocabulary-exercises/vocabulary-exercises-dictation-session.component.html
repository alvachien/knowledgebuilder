<ng-container *transloco="let t">
  <mat-toolbar class="container">
    <mat-toolbar-row>
      <span class="toolbar-spacer"></span>
      <section>
        <div class="example-button-container">
          <mat-progress-bar mode="determinate" [value]="store.progress()"></mat-progress-bar>
        </div>
      </section>
      <button mat-fab class="toolbar-fab-button" [matTooltip]="t('common.quit')"
        [attr.aria-label]="t('common.quit')" (click)="quit.emit()">
        <mat-icon>cancel_presentation</mat-icon>
      </button>
    </mat-toolbar-row>
  </mat-toolbar>
  <div class="vocabulary-dictation-container">
    <div class="vocabulary-dictation-status" role="status" aria-live="polite">
      {{ t('vocabularyExercises.dictating') }} {{ store.currentWordNumber() }} / {{ store.queue().length }}
    </div>
  </div>
</ng-container>
