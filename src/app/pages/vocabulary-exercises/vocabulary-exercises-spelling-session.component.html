<ng-container *transloco="let t">
  <mat-toolbar class="container">
    <mat-toolbar-row>
      <span class="toolbar-spacer"></span>
      <section>
        <div class="example-button-container">
          <mat-progress-bar mode="determinate" [value]="store.progress()"></mat-progress-bar>
        </div>
      </section>
      <button mat-fab class="toolbar-fab-button" [matTooltip]="t('hint')"
        [attr.aria-label]="t('hint')" (click)="store.hint()">
        <mat-icon>info</mat-icon>
      </button>
      <button mat-fab class="toolbar-fab-button" [matTooltip]="t('vocabularyExercises.nextWord')"
        [attr.aria-label]="t('vocabularyExercises.nextWord')" (click)="store.nextWord()">
        <mat-icon>arrow_right</mat-icon>
      </button>
      <button mat-fab class="toolbar-fab-button" [matTooltip]="t('common.quit')"
        [attr.aria-label]="t('common.quit')" (click)="quit.emit()">
        <mat-icon>cancel_presentation</mat-icon>
      </button>
    </mat-toolbar-row>
  </mat-toolbar>
  <div class="vocabulary-typing-container">
    <div class="vocabulary-typing-explain">
      @if(!hideExplain()) {
        {{store.wordExplain()}}
      }
    </div>
    <div class="vocabulary-typing-input-container">
      @for (echar of store.letters(); track echar.idx ) {
        <span class="typing-input-character">{{echar.visible ? echar.letter : '_'}}</span>
      }
    </div>
    @if (!store.currentResultCorrect()) {
      <div class="vocabulary-typing-status" role="status" aria-live="polite">
        {{ t('common.incorrect') }}
      </div>
    }
  </div>
</ng-container>
