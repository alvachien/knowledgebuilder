<ng-container *transloco="let t">
  <div class="container">
    <div>{{ t('vocabularyExercises.dictationResult') }}: {{ store.queue().length }}</div>
    <button mat-raised-button color="primary" (click)="backToList.emit()">{{ t('backToList') }}</button>

    <table mat-table [dataSource]="store.queue()" class="mat-elevation-z8 w-full">
      <!-- Order Column -->
      <ng-container matColumnDef="order">
        <th mat-header-cell *matHeaderCellDef> # </th>
        <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
      </ng-container>

      <!-- English Word Column -->
      <ng-container matColumnDef="enword">
        <th mat-header-cell *matHeaderCellDef> {{ t('vocabularyExercises.word') }} </th>
        <td mat-cell *matCellDef="let element"> {{element.enword}} </td>
      </ng-container>

      <!-- Chinese Word Column -->
      <ng-container matColumnDef="cnword">
        <th mat-header-cell *matHeaderCellDef> {{ t('chinese') }} </th>
        <td mat-cell *matCellDef="let element"> {{element.cnword}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</ng-container>
